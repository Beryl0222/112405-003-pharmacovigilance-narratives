[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-workbench"
version = "0.2.0"
description = "中文药物不良反应叙述、证据溯源与随访重确认工作流（合成演练）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
case-workbench = "case_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["case_workbench*"]
